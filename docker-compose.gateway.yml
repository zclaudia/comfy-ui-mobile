services:
  comfy-mobile-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    env_file:
      - gateway/.env
    environment:
      GATEWAY_DEVICE_STORE: /data/devices.json
      GATEWAY_AGENT_STORE: /data/agent.sqlite
    ports:
      - "8080:8080"
    volumes:
      - gateway-data:/data
    restart: unless-stopped

volumes:
  gateway-data:
