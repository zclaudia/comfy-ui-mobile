[package]
name = "comfy-mobile-ui"
version = "0.1.0"
description = "Android client for ComfyUI through the Comfy Mobile Gateway"
authors = ["Comfy Mobile contributors"]
edition = "2021"

[lib]
name = "comfy_mobile_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2.5.9"
tauri-plugin-websocket = "2.4.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
