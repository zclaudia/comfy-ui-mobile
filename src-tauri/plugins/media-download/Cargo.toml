[package]
name = "tauri-plugin-media-download"
version = "0.1.0"
description = "Android DownloadManager integration for authenticated Comfy Mobile media"
authors = ["Comfy Mobile contributors"]
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-media-download"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
